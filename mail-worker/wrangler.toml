# ============================================================================
# OPC-design 分支专用配置（Worker: cloud-mail-opc / 域名: mail.supracept.work）
# 本文件即 OPC 实例的 wrangler.toml。此前曾用独立的 wrangler-opc.toml + `-c`
# 部署，因 Workers Builds 的一致性检查会比对 wrangler.toml 的 name 与实际部署
# 的 Worker（并在 Wrangler v3.109.0+ 自动发 PR "修复"），已改为本分支
# wrangler.toml 直接承载 OPC 配置；原 wrangler-opc.toml 已删除。
#
# 分支差异警告：deploy 分支上的同名文件是生产配置（cloud-mail @
# mail.jaspershadow.dpdns.org，D1 jaspermail / KV e27cda1b… / R2 jaspermail），
# 两个分支的 wrangler.toml 内容不同，属预期。
#
# 规则：
# 1. 本分支部署：pnpm deploy 或 npx wrangler deploy（无需 -c）；
#    Workers Builds 连接本分支时 Deploy command 用默认的 npx wrangler deploy。
# 2. 从 deploy/main sync 合并时 wrangler.toml 必然冲突：保留本分支全部 OPC
#    取值（name / routes / d1 / kv / r2 / domain / admin），其余取上游。
# 3. 严禁把本文件合入 deploy 或 main（会污染生产配置与同步基线）。
# ============================================================================

name = "cloud-mail-opc"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

workers_dev = false   # 关闭 workers.dev 公共入口，仅通过自定义域名访问

# 自定义域名路由：首次部署时由 wrangler 自动创建对应 DNS 记录。
# 若此处缺失，wrangler 部署时会把它视为"远端多余配置"并从 Worker 上摘除。
[[routes]]
pattern = "mail.supracept.work"
custom_domain = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"			#d1数据库绑定名默认不可修改
database_name = "opcmail"	#d1数据库名字
database_id = "add32c26-0da8-4e93-b6fb-7ad047aeb682"		#d1数据库id（2026-10-25 创建，APAC）

[[kv_namespaces]]
binding = "kv"			#kv绑定名默认不可修改
id = "ec79b98867aa426a8ed060bddbb6f507"					#kv命名空间id（2026-10-25 创建，标题 opcmail-kv）

[[r2_buckets]]
binding = "r2"			#r2对象存储绑定名默认不可修改
bucket_name = "jasper-opcmail"	#r2对象存储桶的名字（2026-10-25 创建，全局唯一）

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[[send_email]]
name = "forward"		#站内转发到已验证的其他邮箱，不限制单个地址

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
ai_model = "@cf/meta/llama-3.1-8b-instruct-fast"			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
analysis_cache = false			#是否开启分析数据缓存
orm_log = false			#是否sql日志
domain = [
	"supracept.work"
]				#邮件域名可可配置多个 示例: ["example1.com","example2.com"]
admin = "supracept@supracept.work"					#管理员的邮箱	示例: admin@example.com
# jwt_secret 不写在此处：本仓库为公共库。请在 Dashboard → Workers & Pages → cloud-mail-opc
# → Settings → Variables and Secrets 中以「Secret」类型保存 jwt_secret（名称必须完全一致）。
# 取值必须与生产实例（cloud-mail）不同；建议 openssl rand -hex 32（仅 0-9a-f，URL 安全，
# 因为该值会出现在 /api/init/<secret> 路径里）。wrangler deploy 恒 keepSecrets:true，不清空。

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
